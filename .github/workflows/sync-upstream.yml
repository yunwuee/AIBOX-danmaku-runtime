name: Watch upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-main-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      commit: ${{ steps.meta.outputs.commit }}
      short_commit: ${{ steps.meta.outputs.short_commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run sync:upstream -- --ref main
      - run: npm run build
      - id: diff
        shell: bash
        run: |
          if git diff --quiet -- generated/upstream upstream.lock.json reports/upstream-sync.md LICENSE THIRD_PARTY_NOTICES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          commit="$(node -p "require('./upstream.lock.json').commit")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=${commit:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: upstream-sync
          path: |
            generated/upstream/
            upstream.lock.json
            reports/upstream-sync.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.4', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: upstream-sync
          path: .sync-staging
      - run: node scripts/apply-sync-artifact.mjs --source .sync-staging
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run check

  auto-release:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      UPSTREAM_COMMIT: ${{ needs.prepare.outputs.commit }}
      UPSTREAM_SHORT: ${{ needs.prepare.outputs.short_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 18.20.4
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: upstream-sync
          path: .sync-staging
      - run: node scripts/apply-sync-artifact.mjs --source .sync-staging
      - run: npm run version:patch
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run check
      - name: Commit main and create release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Release tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/upstream upstream.lock.json reports/upstream-sync.md LICENSE THIRD_PARTY_NOTICES.md package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No staged upstream or version changes were found." >&2
            exit 1
          fi
          git commit -m "chore: sync danmu_api ${UPSTREAM_SHORT} (v${version})"
          git tag -a "${tag}" -m "AIBOX Danmaku Runtime ${tag}"
          git push origin HEAD:main
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Published source commit for ${tag}."
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag }}" -f tag="${{ steps.release.outputs.tag }}"
