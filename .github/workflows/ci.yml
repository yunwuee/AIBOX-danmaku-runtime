name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify time-zone independent archive
        shell: bash
        run: |
          cp artifacts/aibox-danmaku-runtime-*.zip /tmp/aibox-runtime-utc.zip
          TZ=Asia/Shanghai npm run build
          cmp --silent /tmp/aibox-runtime-utc.zip artifacts/aibox-danmaku-runtime-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-candidate
          path: artifacts/
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
